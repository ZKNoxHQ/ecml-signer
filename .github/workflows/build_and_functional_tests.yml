name: Build and run functional tests using ragger through reusable workflow

# This workflow will build the app and then run functional tests using the Ragger framework upon Speculos emulation.
# It calls a reusable workflow developed by Ledger's internal developer team to build the application and upload the
# resulting binaries.
# It then calls another reusable workflow to run the Ragger tests on the compiled application binary.
#
# The build part of this workflow is mandatory, this ensures that the app will be deployable in the Ledger App Store.
# While the test part of this workflow is optional, having functional testing on your application is mandatory and this workflow and
# tooling environment is meant to be easy to use and adapt after forking your application

on:
  workflow_dispatch:
    inputs:
      golden_run:
        type: choice
        required: true
        default: 'Raise an error (default)'
        description: CI behavior if the test snapshots are different than expected.
        options:
          - 'Raise an error (default)'
          - 'Open a PR'
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  # The production build. This is the one that must be deployable to the Ledger
  # App Store, and it does NOT expose the test-only instructions.
  build_application:
    name: Build application using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      upload_app_binaries_artifact: "app_boilerplate_binaries"

  # A second build with TEST_INS=1, which adds DUMMY (0x0A), SAMPLE_IN_BALL
  # (0x0B), KEYGEN_DILITHIUM_CORE (0x0C) and SET_SETTING (0x0D). The standalone
  # suite needs them: the NIST ACVP vectors drive keygen from a chosen seed, and
  # SET_SETTING puts the blind-signing setting in a known state without having
  # to navigate the Settings UI on five different screen layouts.
  build_application_test_ins:
    name: Build application with the test-only instructions
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      flags: "TEST_INS=1"
      upload_app_binaries_artifact: "app_test_ins_binaries"

  tests_standalone:
    name: Run standalone ragger tests using the reusable workflow
    needs: build_application_test_ins
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_tests.yml@v1
    with:
      download_app_binaries_artifact: "app_test_ins_binaries"
      regenerate_snapshots: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_run == 'Open a PR' }}
      test_dir: "tests/standalone"
